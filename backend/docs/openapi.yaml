        search_endpoint:
          type: string
          nullable: true
          description: Search endpoint path
          example: /search
        is_nsfw:
          type: boolean
          description: Whether the site contains NSFW content
          example: false
      required:
        - name
        - url

    WebsiteUpdate:
      type: object
      description: Website update request
      properties:
        name:
          type: string
          description: Website name
          example: Komiku
        url:
          type: string
          format: uri
          description: Website base URL
          example: https://komiku.org
        language_id:
          type: integer
          nullable: true
          description: Primary language ID
          example: 1
        use_browser:
          type: boolean
          description: Whether the site requires headless browser for scraping
